app:
  security:
    dev-auth: false
  demo:
    # Brands the live deployment as "Demo Dance School" and auto-provisions a populated
    # demo school for every newly created user. See DemoSchoolSeeder. Temporary
    # onboarding/marketing surface — remove when real signup → real-school flow ships.
    enabled: true

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://securetoken.google.com/${FIREBASE_PROJECT_ID}
